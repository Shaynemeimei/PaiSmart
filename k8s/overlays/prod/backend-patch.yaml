---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paismart-backend
spec:
  replicas: 3            # Prod 起步 3 + HPA 扩到 10，跨 3 AZ 每 AZ 至少 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      containers:
        - name: backend
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "6"
              memory: "6Gi"
          env:
            - name: JAVA_OPTS
              value: >-
                -XX:+UseG1GC -XX:MaxRAMPercentage=70.0
                -XX:+ExitOnOutOfMemoryError
                -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/heap-dump
                -Dcom.sun.management.jmxremote.rmi.port=9090
                -Dfile.encoding=UTF-8
                -javaagent:/opentelemetry-javaagent.jar   # 配合 OTel Operator 自动挂载
