---
# 生产 Ingress：强制 TLS，Let's Encrypt 正式证书，配合 WAF / CDN（如阿里云 WAF 前置）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paismart-frontend-ingress
  namespace: paismart-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"    # RAG 流式输出关键！
    nginx.ingress.kubernetes.io/limit-rps: "500"
    nginx.ingress.kubernetes.io/limit-rpm: "20000"
    nginx.ingress.kubernetes.io/limit-connections: "2000"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecAuditLog /var/log/modsec_audit.log
      Include /etc/nginx/owasp-modsecurity-crs/nginx-modsecurity.conf
spec:
  rules:
    - host: smart.paicoding.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paismart-frontend-prod
                port:
                  number: 8080
    - host: www.paicoding.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paismart-frontend-prod
                port:
                  number: 8080
  tls:
    - hosts:
        - smart.paicoding.com
        - www.paicoding.com
      secretName: paismart-frontend-prod-tls
