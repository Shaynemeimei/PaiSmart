---
# 仅一份占位 Example；真实部署必须用 SealedSecret / ExternalSecret / Vault / 云 KMS + envFrom
# 做法：
#   1) kubectl -n paismart create secret generic paismart-backend-secrets \
#        --from-env-file=./overlays/dev/secrets.backend.env --dry-run=client -o yaml \
#      | kubeseal --controller-name=sealed-secrets --controller-namespace=sealed-secrets -o yaml \
#      > overlays/dev/sealedsecret-backend.yaml
#   2) 提交 sealedsecret 到 Git，它只能由集群内 sealed-secrets-controller 解密
apiVersion: v1
kind: Secret
metadata:
  name: paismart-backend-secrets
  namespace: paismart
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: paismart
type: Opaque
stringData:
  # ---------- Data stores ----------
  SPRING_DATASOURCE_PASSWORD: "change-me-to-strong-password-rotated-every-90d"
  SPRING_DATA_REDIS_PASSWORD: ""
  ELASTICSEARCH_PASSWORD: "change-me"
  MINIO_ACCESS_KEY: "change-me"
  MINIO_SECRET_KEY: "change-me"

  # ---------- Security ----------
  # Base64: openssl rand -base64 32
  JWT_SECRET_KEY: "REPLACE_WITH_OUTPUT_OF_openssl_rand_-base64_32=="
  ADMIN_BOOTSTRAP_ENABLED: "false"
  ADMIN_BOOTSTRAP_PASSWORD: ""

  # ---------- AI providers ----------
  DEEPSEEK_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  EMBEDDING_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # ---------- OCR (optional) ----------
  ALIYUN_OCR_ACCESS_KEY_ID: ""
  ALIYUN_OCR_ACCESS_KEY_SECRET: ""
  ALIYUN_OCR_CALLBACK_TOKEN: ""

  # ---------- Wechat Pay (optional) ----------
  WX_PAY_APP_ID: ""
  WX_PAY_MERCHANT_ID: ""
  WX_PAY_PRIVATE_KEY: ""
  WX_PAY_MERCHANT_SERIAL_NUMBER: ""
  WX_PAY_API_V3_KEY: ""
