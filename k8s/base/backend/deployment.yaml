---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paismart-backend
  namespace: paismart
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: paismart
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # 每次 ConfigMap/Secret 变更自动滚动更新 Pod
    configmap.reloader.stakater.com/reload: "paismart-backend-config"
    secret.reloader.stakater.com/reload: "paismart-backend-secrets"
spec:
  replicas: 2                 # Dev 起步 2，Prod 通过 HPA 自动扩
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # 零宕机升级（先启新再杀旧）
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/part-of: paismart
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: paismart
      annotations:
        # Prometheus 抓取指标（与 Service annotations 一致）
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
        # OTel instrumentation 注解（部署 opentelemetry-operator 时自动注入 agent）
        instrumentation.opentelemetry.io/inject-java: "monitoring/paismart-java"
    spec:
      serviceAccountName: paismart-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: []
      # 只调度到 app-pool（应用节点池），避免与 data/system 资源争抢
      nodeSelector:
        cloud.google.com/gke-nodepool: "app-pool"   # 或 kubernetes.azure.com/agentpool=apppool / custom label node-pool=app
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "app"
          effect: "NoSchedule"
      affinity:
        # 2 个 Pod 尽量分散到不同 node + 不同 AZ，避免单点故障
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                topologyKey: kubernetes.io/hostname
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: backend
                topologyKey: topology.kubernetes.io/zone
      terminationGracePeriodSeconds: 60      # WebSocket + Kafka 优雅下线需要更长时间
      initContainers:
        # 等待下游依赖就绪，避免启动时一堆 ConnectException 刷屏
        - name: wait-for-deps
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[init] Waiting MySQL"
              for i in $(seq 1 60); do
                if nc -z "$SPRING_DATASOURCE_HOST" 3306 2>/dev/null; then break; fi
                sleep 2; done
              echo "[init] Waiting Redis"
              for i in $(seq 1 30); do
                if nc -z "$SPRING_DATA_REDIS_HOST" 6379 2>/dev/null; then break; fi
                sleep 2; done
              echo "[init] Done"
          envFrom:
            - configMapRef:
                name: paismart-backend-config
      containers:
        - name: backend
          image: "registry.paicoding.com/paismart/backend:replace-with-image-tag"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: http-api
              containerPort: 8081
              protocol: TCP
          # 环境变量分两段：非敏感 ConfigMap + 密钥 Secret
          envFrom:
            - configMapRef:
                name: paismart-backend-config
            - secretRef:
                name: paismart-backend-secrets
          env:
            # 把 DataSource URL 中的 host 拆给 init container 的 nc 检测
            - name: SPRING_DATASOURCE_HOST
              valueFrom:
                configMapKeyRef:
                  name: paismart-backend-config
                  key: SPRING_DATASOURCE_URL
              # 真实部署建议单独加 SPRING_DATASOURCE_HOST 键到 ConfigMap，这里仅示例写法
          resources:
            # 起步值（按压测调）：最小 JVM 堆 ≈ 1.5G，WebFlux/ES client 比较吃内存
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          # ================= 健康检查 =================
          # Startup：启动慢（JVM + Spring 初始化 + 下游健康），给 120s 宽容
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          # Liveness：卡死 / OOM 时重启
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          # Readiness：没就绪时从 Service Endpoints 摘流
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          # 生命周期钩子：Kafka 提交偏移 / WebSocket 连接迁移
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    echo "[preStop] Signaling app to shutdown gracefully, sleep 30 for WS drain"
                    sleep 30
          # 临时可写目录：LiteParse TESSDATA、Tika temp、JVM hs_err_pid
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: heap-dump
              mountPath: /heap-dump
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: "256Mi"
        - name: heap-dump
          emptyDir:
            sizeLimit: "4Gi"
      imagePullSecrets:
        - name: paismart-registry-secret     # 私有镜像仓库的 pull secret（在 overlays 里创建）
