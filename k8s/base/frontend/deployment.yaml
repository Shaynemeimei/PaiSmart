---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paismart-frontend
  namespace: paismart
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: paismart
    app.kubernetes.io/managed-by: kustomize
  annotations:
    configmap.reloader.stakater.com/reload: "paismart-frontend-nginx"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: paismart
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: paismart
    spec:
      serviceAccountName: paismart-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101       # nginx alpine 默认 uid 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        cloud.google.com/gke-nodepool: "app-pool"
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "app"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: frontend
                topologyKey: topology.kubernetes.io/zone
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: "registry.paicoding.com/paismart/frontend:replace-with-image-tag"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 注入后端 Service DNS，通过 envsubst 写入 nginx.conf upstream
            - name: BACKEND_UPSTREAM
              value: "http://paismart-backend.paismart.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /favicon.svg
              port: 8080
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 3
          # 只读根文件系统下：给 nginx temp 可写目录
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-confd
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: "64Mi"
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: "8Mi"
        - name: nginx-tmp
          emptyDir:
            medium: Memory
            sizeLimit: "64Mi"
        - name: nginx-log
          emptyDir:
            sizeLimit: "256Mi"
        - name: nginx-confd
          emptyDir:
            sizeLimit: "8Mi"
      imagePullSecrets:
        - name: paismart-registry-secret
