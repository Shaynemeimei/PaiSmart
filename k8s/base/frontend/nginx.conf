# Nginx 配置：PaiSmart Frontend (SPA)
# 职责：
#  - 托管 Vite 构建产物 + gzip/brotli 预压缩
#  - SPA 路由 fallback 到 index.html
#  - 反向代理 /api / /proxy-ws / /ws /actuator -> backend K8s Service
#  - 安全响应头 (HSTS / CSP / X-Frame 等)
# 注：${BACKEND_UPSTREAM} 由容器启动时 envsubst 替换为 backend Service 的 DNS:PORT
# ---------------------------------------------------------------------------
server {
  listen 8080;
  server_name _;

  # ---- 静态缓存与压缩 ----
  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
  gzip_vary on;
  gzip_static on;              # 使用预压缩的 .gz 文件（Dockerfile 里生成）
  brotli_static on;            # 使用预压缩的 .br 文件

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 50m;    # 与后端 multipart 一致

  root /usr/share/nginx/html;
  index index.html;

  # ---- 安全响应头 ----
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # TODO: 上线前收紧 Content-Security-Policy，避免第三方脚本注入
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; worker-src 'self' blob:;" always;

  # ---- 静态资源强缓存（Vite 带 hash） ----
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- 反向代理：/api/* -> backend ----
  location /api/ {
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;   # 聊天流式输出需长超时
    proxy_read_timeout    600s;
    proxy_buffering off;          # SSE / 流式响应必须关闭缓冲
    proxy_cache off;
  }

  # ---- 反向代理：/actuator (Prometheus scrape + Ingress 健康检查) ----
  location = /actuator/health/readiness {
    access_log off;
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- 反向代理：/proxy-ws -> /ws (WebSocket 聊天) ----
  location /proxy-ws {
    rewrite ^/proxy-ws(/.*)$ $1 break;
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout                  3600s;   # WS 长连接 1h
    proxy_send_timeout                  3600s;
  }

  # ---- 反向代理：直接 /ws/* 路径兼容 ----
  location /ws {
    proxy_pass ${BACKEND_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout                  3600s;
    proxy_send_timeout                  3600s;
  }

  # ---- SPA 路由：所有非文件路径回退到 index.html ----
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 健康检查：Ingress controller 探测
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  error_page 404 /index.html;
}
