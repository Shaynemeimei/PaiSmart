---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paismart-frontend-hpa
  namespace: paismart
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: paismart
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paismart-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
