---
# Kustomize Base 汇总所有公共资源
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: paismart

commonLabels:
  app.kubernetes.io/part-of: paismart
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.3.13"

resources:
  - namespace.yaml
  - serviceaccounts-and-quotas.yaml
  - networkpolicy.yaml
  # Backend
  - backend/configmap.yaml
  - backend/service.yaml
  - backend/deployment.yaml
  - backend/hpa.yaml
  - backend/pdb.yaml
  # Frontend
  - frontend/service.yaml
  - frontend/deployment.yaml
  - frontend/hpa.yaml
  - frontend/pdb.yaml

# 用文件生成 ConfigMap：nginx.conf => paismart-frontend-nginx
configMapGenerator:
  - name: paismart-frontend-nginx
    namespace: paismart
    options:
      disableNameSuffixHash: true
    files:
      - frontend/nginx.conf

# 用 envs 文件生成 Secret（示例，真实用 SealedSecret 覆盖）
secretGenerator:
  - name: paismart-backend-secrets
    namespace: paismart
    options:
      disableNameSuffixHash: true
    type: Opaque
    envs:
      - backend/secret-example.env    # 不存在会报错；下面我们会补一个示例文件

# 统一加 annotations
generatorOptions:
  annotations:
    note: "This is generated from kustomize base; overlays may patch these"
