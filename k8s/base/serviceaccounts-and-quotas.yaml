---
# 两个 ServiceAccount：
# - paismart-backend：供后端 Pod 使用；若后续接入云权限，可绑定 IRSA / Workload Identity
# - paismart-frontend：供前端 Pod 使用，通常权限最小化
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paismart-backend
  namespace: paismart
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: paismart
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paismart-frontend
  namespace: paismart
  labels:
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: paismart
automountServiceAccountToken: false
---
# 资源配额：防止某一命名空间耗尽集群资源（可按需调整）
apiVersion: v1
kind: ResourceQuota
metadata:
  name: paismart-quota
  namespace: paismart
spec:
  hard:
    requests.cpu: "32"
    requests.memory: "64Gi"
    limits.cpu: "64"
    limits.memory: "128Gi"
    persistentvolumeclaims: "50"
    services.loadbalancers: "2"
    services.nodeports: "0"
    count/pods: "100"
---
# LimitRange：为没声明 requests/limits 的 Pod 设默认值（防止 OOMKill 影响节点）
apiVersion: v1
kind: LimitRange
metadata:
  name: paismart-limits
  namespace: paismart
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "200m"
        memory: "256Mi"
      max:
        cpu: "8"
        memory: "16Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
