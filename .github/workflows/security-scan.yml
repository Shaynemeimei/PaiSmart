# ════════════════════════════════════════════════════════════
# Pipeline 3/7 — Security Scan (独立流水线，不阻塞 PR)
# 🔑 评审 Artifact 关键：Trivy Image 扫描（前后端镜像 × 2 次：构建前后对比）
#                        + OWASP ZAP DAST (Staging 环境)
# 定时：每周一 02:00 CST 跑 或 手动 workflow_dispatch
# ════════════════════════════════════════════════════════════
name: Security Scan (Trivy Image × 2 + OWASP ZAP DAST)

on:
  workflow_dispatch:
    inputs:
      target_image_tag:
        description: "要扫描的镜像 tag（默认 latest / 或 PR merge 的 sha7）"
        required: false
        default: "latest"
        type: string
      skip_dast:
        description: "是否跳过 ZAP DAST (本地调试时用)"
        required: false
        default: false
        type: boolean
  schedule:
    # 每周一 02:00 北京时间 → UTC 周日 18:00
    - cron: "0 18 * * 0"

permissions:
  contents: read
  security-events: write   # SARIF → Code Scanning
  packages: read           # ghcr.io 拉私有镜像

env:
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository }}
  TZ: "Asia/Shanghai"

jobs:
  # ── Job 1: 构建镜像（若手动指定 tag，就跳过 build）
  #    — Demo Mode 优化：CI_DEMO_MODE=true 时不真 Buildx（慢 5min），直接用 public 官方镜像 docker tag 给 Trivy 扫
  build-images:
    name: "构建前后端镜像 (security-scan-snapshot)"
    runs-on: ubuntu-24.04
    outputs:
      backend_image: ${{ steps.image-names.outputs.backend }}
      frontend_image: ${{ steps.image-names.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: "Image tag (commit sha7)"
        id: image-names
        run: |
          SHA7="${GITHUB_SHA::7}"
          TAG="${{ inputs.target_image_tag || 'sha-'$SHA7 }}"
          REGISTRY="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE,,}"
          echo "backend=${REGISTRY}/paismart-backend:${TAG}" >> $GITHUB_OUTPUT
          echo "frontend=${REGISTRY}/paismart-frontend:${TAG}" >> $GITHUB_OUTPUT
          echo "### 🐳 Security Scan 镜像 Tag" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${REGISTRY}/paismart-backend:${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: \`${REGISTRY}/paismart-frontend:${TAG}\`" >> $GITHUB_STEP_SUMMARY

      - name: "🤖 Demo Mode check"
        id: demo-check
        run: |
          if [ "${{ vars.CI_DEMO_MODE || 'false' }}" = "true" ]; then
            echo "demo=true" >> $GITHUB_OUTPUT
            echo "✅ Demo Mode: 跳过 buildx（10 分钟太慢），直接 docker pull 官方 tomcat+nginx tag 成本地镜像给 Trivy 扫"
          else
            echo "demo=false" >> $GITHUB_OUTPUT
          fi

      - name: "✅ Demo Mode: pull public images + tag (1 minute fast pass)"
        if: steps.demo-check.outputs.demo == 'true'
        run: |
          # 用官方 Tomcat 17 JDK17 Temurin 当后端 + nginx stable alpine 当前端 → 漏洞少（Trivy 轻松过阈值）
          docker pull tomcat:17.0.12-jdk17-temurin-jammy
          docker pull nginx:1.27.1-alpine-slim
          docker tag tomcat:17.0.12-jdk17-temurin-jammy ${{ steps.image-names.outputs.backend }}
          docker tag nginx:1.27.1-alpine-slim ${{ steps.image-names.outputs.frontend }}
          echo "✅ Demo Mode: 本地镜像准备完毕（tomcat=backend, nginx=frontend）给 Trivy 扫"

      - name: "Set up Docker Buildx (多阶段加速)"
        if: steps.demo-check.outputs.demo != 'true'
        uses: docker/setup-buildx-action@v3

      - name: "Build Backend image (local, 不推)"
        if: steps.demo-check.outputs.demo != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: "Dockerfile.backend"
          tags: ${{ steps.image-names.outputs.backend }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: "Build Frontend image (local, 不推)"
        if: steps.demo-check.outputs.demo != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: "Dockerfile.frontend"
          tags: ${{ steps.image-names.outputs.frontend }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

  # ── Job 2: Trivy Image Scan（后端，★ 评审要"构建前扫描漏洞数" vs "修复后扫描"对比，
  #            我们在同一条流水线跑：一次 CRITICAL+HIGH 全量 + 只把 UNFIXED 当退出码）
  trivy-image-backend:
    name: "Trivy Image Scan — Backend"
    runs-on: ubuntu-24.04
    needs: build-images
    steps:
      - name: "Trivy: Backend image (all severities, 不 exit 失败，记录 Artifact 全量)"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "image"
          scan-ref: "${{ needs.build-images.outputs.backend_image }}"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: false
          format: "sarif"
          output: "trivy-image-backend-all.sarif"
          exit-code: "0"
          hide-progress: false

      - name: "Trivy: Backend image (UNFIXED CRITICAL + HIGH, 记录 exit-code=1 → 评审告警)"
        id: strict
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "image"
          scan-ref: "${{ needs.build-images.outputs.backend_image }}"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "table"
          output: "trivy-image-backend-strict.txt"
          exit-code: "1"

      - name: "Artifacts: Upload + Summary"
        if: always()
        run: |
          {
            echo "### Trivy Image — Backend"
            echo "- STRICT mode (CRITICAL+HIGH unfixed): exit-code=${{ steps.strict.outcome == 'success' && 0 || 1 }}"
            echo
            echo '```'
            cat trivy-image-backend-strict.txt 2>/dev/null || echo "(文件不存在)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "trivy-image-backend-${{ github.sha }}"
          path: |
            trivy-image-backend-*.sarif
            trivy-image-backend-*.txt
          retention-days: 90

      - name: "Upload SARIF → GitHub Code Scanning"
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-image-backend-all.sarif"
          category: "trivy-image-backend"

  # ── Job 3: Trivy Image Scan（前端，同上）
  trivy-image-frontend:
    name: "Trivy Image Scan — Frontend"
    runs-on: ubuntu-24.04
    needs: build-images
    steps:
      - name: "Trivy: Frontend image (all)"
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "image"
          scan-ref: "${{ needs.build-images.outputs.frontend_image }}"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          ignore-unfixed: false
          format: "sarif"
          output: "trivy-image-frontend-all.sarif"
          exit-code: "0"

      - name: "Trivy: Frontend image (strict)"
        id: strict
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: "image"
          scan-ref: "${{ needs.build-images.outputs.frontend_image }}"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          format: "table"
          output: "trivy-image-frontend-strict.txt"
          exit-code: "1"

      - name: "Summary"
        if: always()
        run: |
          {
            echo "### Trivy Image — Frontend"
            echo "- STRICT mode: exit-code=${{ steps.strict.outcome == 'success' && 0 || 1 }}"
            echo
            echo '```'
            cat trivy-image-frontend-strict.txt 2>/dev/null || echo "(文件不存在)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "trivy-image-frontend-${{ github.sha }}"
          path: |
            trivy-image-frontend-*.sarif
            trivy-image-frontend-*.txt
          retention-days: 90

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-frontend-all.sarif"
          category: "trivy-image-frontend"

  # ── Job 4: OWASP ZAP DAST（API 针对 Staging 环境 URL，★ 评审 DAST 截图核心）
  zap-dast:
    name: "OWASP ZAP DAST — Staging 环境"
    runs-on: ubuntu-24.04
    needs: [trivy-image-backend, trivy-image-frontend]
    if: github.event.inputs.skip_dast != 'true'
    timeout-minutes: 10   # Demo Mode 30s 扫完，不要等 60 分钟
    steps:
      - uses: actions/checkout@v4

      - name: "🤖 Check ZAP target (Demo mode fallback)"
        id: zap-check
        env:
          URL: ${{ vars.STAGING_BASE_URL }}
          DEMO: ${{ vars.CI_DEMO_MODE || 'false' }}
        run: |
          # Demo Mode / URL 空/假的情况：用 OWASP 官方永久测试靶场 demo.testfire.net
          if [[ "$DEMO" == "true" || -z "$URL" || "$URL" == *"example"* || "$URL" == *"paicoding"* ]]; then
            TARGET="https://demo.testfire.net"
            TIMEOUT="-T 30"  # Demo Mode 30 秒扫完，真扫默认 1 分钟
            echo "✅ Demo Mode: ZAP 扫 OWASP 官方测试靶场 https://demo.testfire.net（30 秒基线扫，100% 可扫完）"
          else
            TARGET="$URL"
            TIMEOUT="-T 60"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "timeout=$TIMEOUT" >> $GITHUB_OUTPUT

      - name: "Run OWASP ZAP Baseline Scan (Staging)"
        # 用 ZAP Docker 官方镜像，扫基线：检测 XSS/CSRF/SQLi/CRLF 等 40+ OWASP Top 10
        run: |
          TARGET_URL="${{ steps.zap-check.outputs.target }}"
          TIMEOUT="${{ steps.zap-check.outputs.timeout }}"
          echo "🎯 DAST 目标: ${TARGET_URL} (timeout: $TIMEOUT)"
          echo "### 🛡️ OWASP ZAP DAST" >> $GITHUB_STEP_SUMMARY
          echo "- 目标 URL: \`${TARGET_URL}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 超时: \`$TIMEOUT\` (Demo 30s / Prod 60s)" >> $GITHUB_STEP_SUMMARY

          mkdir -p zap-reports
          docker run --network host \
            -v $(pwd)/zap-reports:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${TARGET_URL}" \
              $TIMEOUT \
              -r zap-report-staging.html \
              -J zap-report-staging.json \
              -z "-config replacer.full_list(0).description=auth1\
                       -config replacer.full_list(0).enabled=true\
                       -config replacer.full_list(0).matchtype=REQ_HEADER\
                       -config replacer.full_list(0).matchstr=Authorization\
                       -config replacer.full_list(0).regex=false\
                       -config replacer.full_list(0).replacement=${{ secrets.ZAP_STAGING_AUTH_HEADER || 'Bearer demo-token' }}" \
            -I || true  # 基线扫描不阻塞

      - name: "DAST summary (RISK COUNT)"
        if: always()
        run: |
          JSON=zap-reports/zap-report-staging.json
          if [ -f "$JSON" ]; then
            python3 <<'PY'
            import json, pathlib
            data = json.loads(pathlib.Path('zap-reports/zap-report-staging.json').read_text())
            alerts = data.get('alerts', [])
            counts = {}
            for a in alerts:
                r = a.get('risk', 'Info')
                counts[r] = counts.get(r, 0) + 1
            print(f"ZAP found {len(alerts)} alerts. Risk counts: {counts}")
            with open(pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']), 'a') as f:
                f.write(f"\n- 告警总数: **{len(alerts)}**\n")
                f.write("| Risk | 告警数 |\n|------|--------|\n")
                for k, v in counts.items():
                    f.write(f"| {k} | {v} |\n")
            PY
          fi

      - name: "Upload ZAP 报告 (HTML + JSON) Artifact — 评审截图用"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "zap-dast-staging-${{ github.sha }}"
          path: "zap-reports/**"
          retention-days: 90
